workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Capacitor copy
        script: npx cap copy android
      - name: Set gradlew permission
        script: chmod +x android/gradlew
      - name: Build Android
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
